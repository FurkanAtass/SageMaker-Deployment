[project]
name = "sagemaker-deployment"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.6",
    "dotenv>=0.9.9",
    "sagemaker>=3.10.1",
    "sagemaker-mlflow>=0.4.0",
    "ultralytics>=8.4.47",
    "uvicorn>=0.46.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
